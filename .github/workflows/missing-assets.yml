name: Recover missing Deva assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/missing-assets.yml"
      - "scripts/recover_missing_assets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/recover_missing_assets.py
      - name: Commit recovered variants
        run: |
          git config user.name "deva-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/known-assets archive/inventory/missing_asset_recovery.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: recover missing Deva image variants"
          git pull --rebase
          git push
