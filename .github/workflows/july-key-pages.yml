name: Probe July 2025 key pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/july-key-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch July pages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p archive/july-2025
          : > archive/july-2025/status.csv
          TS=20250711185606
          declare -A PAGES
          PAGES[hakkimizda]="https://devaaluminyum.com/Hakkimizda.html"
          PAGES[iletisim]="https://devaaluminyum.com/iletisim.html"
          PAGES[hizmetler]="https://devaaluminyum.com/Sayfa/56/hizmetlerimiz"
          PAGES[referanslar]="https://devaaluminyum.com/Sayfa/72/referanslarimiz"
          for K in hakkimizda iletisim hizmetler referanslar; do
            SRC="https://web.archive.org/web/${TS}id_/${PAGES[$K]}"
            CODE=$(curl -A "Mozilla/5.0" -L --connect-timeout 5 --max-time 20 -sS -o "archive/july-2025/${K}.html" -w "%{http_code}" "$SRC" || true)
            SIZE=$(wc -c < "archive/july-2025/${K}.html" 2>/dev/null || echo 0)
            echo "$K,$CODE,$SIZE" >> archive/july-2025/status.csv
          done
      - name: Commit July pages
        run: |
          git config user.name "deva-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/july-2025/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: probe July 2025 key pages"
          git pull --rebase
          git push
