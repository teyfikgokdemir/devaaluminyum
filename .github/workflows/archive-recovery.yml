name: Recover exact Wayback snapshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-recovery.yml"
      - "scripts/exact_wayback_recovery.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Recover exact 2025 Wayback snapshots
        run: python scripts/exact_wayback_recovery.py
      - name: Commit recovered archive
        run: |
          git config user.name "deva-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "No recovered changes"
            exit 0
          fi
          git commit -m "archive: recover exact Deva Alüminyum 2025 snapshots"
          git pull --rebase
          git push
