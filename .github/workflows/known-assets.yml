name: Recover known Deva assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/known-assets.yml"
      - "scripts/recover_known_assets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/recover_known_assets.py
      - name: Commit assets
        run: |
          git config user.name "deva-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/known-assets archive/inventory/known_assets.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: recover known Deva media assets"
          git pull --rebase
          git push
