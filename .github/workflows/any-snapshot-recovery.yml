name: Recover any Wayback snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/any-snapshot-recovery.yml"
      - "scripts/recover_any_snapshot.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/recover_any_snapshot.py
      - name: Commit recovered history
        run: |
          git config user.name "deva-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/any-snapshot archive/inventory/any_snapshot_*.csv archive/inventory/any_snapshot_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: recover Deva assets from historical snapshots"
          git pull --rebase
          git push
