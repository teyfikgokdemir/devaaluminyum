name: Deva site QA

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/qa_site.py"
      - ".github/workflows/site-qa.yml"
      - "archive/known-assets/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 pillow
      - run: python scripts/qa_site.py
      - name: Commit QA reports
        if: always()
        run: |
          git config user.name "deva-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qa/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "qa: update Deva site audit reports"
          git pull --rebase
          git push
