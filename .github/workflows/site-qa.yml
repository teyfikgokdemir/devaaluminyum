name: Deva site QA

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/qa_site.py"
      - ".github/workflows/site-qa.yml"
      - "archive/known-assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 pillow
      - name: Run site QA
        run: python scripts/qa_site.py
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deva-site-qa
          path: qa/
          retention-days: 7
