name: Recover normalized root assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/root-assets.yml"
      - "scripts/root_asset_recovery.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/root_asset_recovery.py
      - run: |
          git config user.name "deva-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/recovered-root-assets archive/inventory/root_asset_recovery.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: recover normalized root assets"
          git pull --rebase
          git push
