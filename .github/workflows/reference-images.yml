name: Recover reference gallery images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-images.yml"
      - "scripts/reference_images.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/reference_images.py
      - run: |
          git config user.name "deva-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/references-images archive/inventory/reference_images.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: recover reference gallery images"
          git pull --rebase
          git push
